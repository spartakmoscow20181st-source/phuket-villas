<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1618;--card:#13252a;--ink:#e8f1f0;--mute:#93a8a9;--line:#23393d;--sea:#147a7d;--soft:#173238}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none;padding-bottom:calc(var(--navh) + var(--sb) + 16px)}
.view.on{display:block}
/* шапка */
.hero{background:var(--sea);color:var(--sea-ink);padding:calc(22px + var(--st)) 16px 20px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,6.4vw,34px);max-width:16ch}
.hero p{margin:6px 0 0;opacity:.85;font-size:15px}
.hero .wave{position:absolute;right:-30px;bottom:-12px;width:190px;opacity:.18}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stats span{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
/* фильтры */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;min-height:38px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px 0;font-size:13px;color:var(--mute)}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
/* карточки */
.grid{display:grid;gap:16px;padding:16px;grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto}

.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.25)}
.galw{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:16/10;background:var(--soft)}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.heart{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#13242a;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.heart.flat{position:static;flex:none;background:var(--card);color:var(--ink)}
.heart.on{color:var(--coral)}.heart.on svg{fill:currentColor}
.badge{position:absolute;top:12px;left:12px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;color:#fff;background:var(--ok)}
.badge.mid{background:var(--sun);color:#3a2a00}.badge.over{background:var(--coral)}
.rank{position:absolute;left:12px;bottom:12px;background:var(--coral);color:#fff;font:700 13px Unbounded,sans-serif;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.body{padding:14px 16px 16px;cursor:pointer}
.r1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.price b{font-size:18px}.price small{display:block;color:var(--mute);font-size:12px}
.area{color:var(--mute);font-size:14px;margin-top:4px;display:flex;align-items:center;gap:4px}
.area svg{width:15px;height:15px}
.facts{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:12px 0 0}
.facts li{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.tot b{white-space:nowrap}.tot span{color:var(--mute)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.demo{font-size:13px;color:var(--mute);text-align:center;padding:0 16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);height:calc(var(--navh) + var(--sb));padding-bottom:var(--sb)}

nav.tabs em{position:absolute;top:8px;left:calc(50% + 6px);background:var(--coral);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.ppin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.peek.on{display:grid}
.peek img{width:96px;height:96px;border-radius:12px;object-fit:cover}
.peek h3{font-size:15px;padding-right:30px}

.mapmsg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mute)}

.toast.on{opacity:1;transform:translate(-50%,0)}
/* карточка объекта */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;top:calc(36px + var(--st));background:var(--bg);border-radius:22px 22px 0 0;overflow-y:auto;overscroll-behavior:contain;max-width:760px;margin:0 auto;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

.sheet .gal{aspect-ratio:4/3}
.x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3}
.shb{padding:16px 16px calc(24px + var(--sb))}
.shb h2{font-size:24px;margin-top:2px}
.pbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pbox div{background:var(--card);border-radius:14px;padding:10px}
.pbox small{display:block;color:var(--mute);font-size:12px}
.pbox b{font-size:16px;white-space:nowrap}
.desc{margin:14px 0 0}
.am{display:flex;flex-wrap:wrap;gap:6px}
.am span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.pc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){.pc{grid-template-columns:minmax(0,1fr)}}

.pc h4{margin-top:14px}
.note{margin-top:14px;background:#fff6dc;color:#4a3800;border-radius:14px;padding:12px;font-size:14px}

.near{list-style:none;padding:0;margin:0;font-size:14px}

.near li b{white-space:nowrap}
.near i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
</style>
</head>

  { id:'oldtown', name:'Старый город Пхукета', type:'sight', lat:7.8846, lng:98.3887, desc:'Сино-португальские улочки и кафе' },

];
</script>

<script>
{
const $ = s => document.querySelector(s);
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);

/* ---------- Telegram ---------- */
function applyTheme(){ if(inTG) document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; }
if(inTG){
  try{ tg.ready(); tg.expand(); applyTheme(); tg.onEvent('themeChanged', applyTheme); }catch(e){}
}
const haptic = () => { try{ inTG && tg.HapticFeedback.impactOccurred('light'); }catch(e){} };
function openExt(url){ if(inTG){ try{ tg.openLink(url); return true; }catch(e){} } return false; }
function openTgLink(url){ if(inTG){ try{ tg.openTelegramLink(url); return; }catch(e){} } location.href = url; }

/* ---------- хранилище ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let favs = store.get('phk-favs', []).filter(id => VILLAS.some(v => v.id === id));

/* ---------- утилиты ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ' + TRIP.cur;
const km = d => d < 1 ? (Math.round(d * 20) * 50) + ' м' : d.toFixed(1).replace('.', ',') + ' км';
function dist(a, b){
  const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const CAT = {
  beach:    { name:'Пляжи',     color:'#1aa3c4', svg:'<path d="M12 4a8 8 0 0 1 8 8H4a8 8 0 0 1 8-8zM12 12v8M8 20h8"/>' },
  sight:    { name:'Места',     color:'#8e5bd6', svg:'<path d="M4 20h16M6 20v-9M18 20v-9M3 11l9-6 9 6M10 20v-5h4v5"/>' },
  night:    { name:'Ночь и еда',color:'#e2457a', svg:'<path d="M6 4h12l-6 8zM12 12v7M8 20h8"/>' },
  shop:     { name:'Шопинг',    color:'#e08a1e', svg:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>' },
  transport:{ name:'Транспорт', color:'#4b5d67', svg:'<path d="M3 15l2 4h14l2-4zM12 4v11M12 5l6 8h-6"/>' }
};

/* заглушки фото (если photos пустой) */
const PAL = [['#8fd3ea','#0b5d63','#f3dcae'],['#ffbf94','#127c80','#f6e5c6'],['#a7dccd','#0e4f58','#ecd8b2'],['#ffd884','#1a6f7a','#f2ddb8']];
function ph(seed, i){
  const p = PAL[(seed + i) % PAL.length], sx = 560 - i * 110;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="#fff3df"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><circle cx="${sx}" cy="110" r="44" fill="#fff" opacity=".75"/><rect y="300" width="800" height="200" fill="${p[1]}"/><path d="M0 312h800" stroke="#fff" stroke-width="6" opacity=".3"/><path d="M170 300V205l160-70 160 70v95z" fill="${p[2]}"/><path d="M150 212l180-88 180 88" fill="none" stroke="#5a3b28" stroke-width="16" stroke-linejoin="round"/><rect x="292" y="228" width="76" height="72" fill="#5a3b28" opacity=".85"/><rect x="410" y="232" width="56" height="40" fill="#fff" opacity=".7"/><rect x="430" y="340" width="260" height="64" rx="12" fill="#6fe0ea"/><path d="M700 300c-4-60 6-110 30-150M730 150c-30-10-60 0-75 18M730 150c25-22 55-22 70-8M730 150c-5-30 8-52 30-60" fill="none" stroke="#2f5d3a" stroke-width="9" stroke-linecap="round"/><text x="36" y="470" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff" opacity=".85">Демо-фото ${i + 1}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* производные поля */
const beaches = PLACES.filter(p => p.type === 'beach');
const bangla = PLACES.find(p => p.id === 'bangla');
VILLAS.forEach((v, idx) => {
  v.imgs = (v.photos && v.photos.length) ? v.photos : [0, 1, 2, 3].map(i => ph(idx, i));
  v.total = v.priceTotal || v.pricePerNight * TRIP.nights;
  v.night = v.priceTotal ? v.priceTotal / TRIP.nights : v.pricePerNight;
  v.pp = Math.round(v.total / TRIP.guests / 100) * 100;
  const nb = beaches.map(b => ({ b, d: dist(v, b) })).sort((a, b) => a.d - b.d)[0];
  v.beach = nb ? nb.d : 99; v.beachName = nb ? nb.b.name : '';
  v.toBangla = bangla ? dist(v, bangla) : null;
  v.fit = v.total <= TRIP.budgetMax ? 'ok' : v.total <= TRIP.budgetMax * 1.1 ? 'mid' : 'over';
});
const FIT = { ok:'В бюджете', mid:'Чуть выше бюджета', over:'Дороже бюджета' };

/* ---------- шапка ---------- */
$('#ttl').textContent = TRIP.title;
$('#sub').textContent = `${TRIP.dates} · ${TRIP.nights} ночей · ${TRIP.guests}+ человек`;
$('#stats').innerHTML = [
  `${VILLAS.length} вариантов`,
  `бюджет ${Math.round(TRIP.budgetMin / 1000)}–${Math.round(TRIP.budgetMax / 1000)} тыс ${TRIP.cur}`,
  `от ${money(Math.min(...VILLAS.map(v => v.total)))}`
].map(s => `<span>${esc(s)}</span>`).join('');

/* ---------- фильтры ---------- */
const areas = [...new Set(VILLAS.map(v => v.area))];
const F = store.get('phk-filter', { area:'all', budget:false, pool:false, rooms3:false, sort:'price' });
if(F.area !== 'all' && !areas.includes(F.area)) F.area = 'all';
function renderFilters(){
  const a = [['all', 'Все районы'], ...areas.map(x => [x, x])].map(([k, t]) =>
    `<button class="chip ${F.area === k ? 'on' : ''}" data-area="${esc(k)}">${esc(t)}</button>`).join('');
  const t = [['budget', 'В бюджете'], ['pool', 'Бассейн'], ['rooms3', '3+ спальни']].map(([k, t]) =>
    `<button class="chip ${F[k] ? 'on' : ''}" data-flag="${k}">${t}</button>`).join('');
  $('#filters').innerHTML = a + t;
  $('#sort').value = F.sort;
}
function filtered(){
  const s = { price:(a, b) => a.total - b.total, beach:(a, b) => a.beach - b.beach, rating:(a, b) => b.rating - a.rating, rooms:(a, b) => b.bedrooms - a.bedrooms }[F.sort];
  return VILLAS.filter(v => (F.area === 'all' || v.area === F.area) && (!F.budget || v.fit === 'ok') && (!F.pool || v.pool) && (!F.rooms3 || v.bedrooms >= 3)).sort(s);
}

/* ---------- список ---------- */
const heartBtn = v => `<button class="heart ${favs.includes(v.id) ? 'on' : ''}" data-fav="${v.id}" aria-label="В избранное"><svg class="i"><use href="#i-heart"/></svg></button>`;
function gallery(v){
  return `<div class="galw"><div class="gal" data-gal>${v.imgs.map((src, i) => `<img src="${esc(src)}" alt="${esc(v.name)}, фото ${i + 1}" loading="${i ? 'lazy' : 'eager'}">`).join('')}</div>
    <span class="cnt">1/${v.imgs.length}</span>`;
}
function card(v){
  const r = favs.indexOf(v.id);
  return `<article class="card">${gallery(v)}${heartBtn(v)}<span class="badge ${v.fit}">${FIT[v.fit]}</span>${r > -1 ? `<span class="rank">${r + 1}</span>` : ''}</div>
  <div class="body" data-open="${v.id}">
    <div class="r1"><h3>${esc(v.name)}</h3><div class="price"><b>${money(v.night)}</b><small>за ночь</small></div></div>
    <div class="area"><svg class="i"><use href="#i-pin"/></svg>${esc(v.area)} · ${km(v.beach)} до пляжа${v.toBangla != null ? ' · ' + km(v.toBangla) + ' до Bangla' : ''}</div>
    <ul class="facts"><li>${v.bedrooms} спальни</li><li>${v.beds} кровати</li><li>до ${v.guests} гостей</li>${v.pool ? '<li>Бассейн</li>' : ''}<li>★ ${String(v.rating).replace('.', ',')} · ${v.reviews}</li></ul>
    <div class="tot"><span>За ${TRIP.nights} ночей <b>${money(v.total)}</b></span><span>≈ <b>${money(v.pp)}</b> с чел.</span></div>
  </div></article>`;
}
function renderList(){
  const items = filtered();
  $('#shown').textContent = `Показано ${items.length} из ${VILLAS.length}`;
  $('#list').innerHTML = items.length ? items.map(card).join('') : `<div class="empty">Под фильтры ничего не подошло.<br><br><button class="chip" data-reset>Сбросить фильтры</button></div>`;
  bindGalleries($('#list'));
}
function bindGalleries(root){
  root.querySelectorAll('[data-gal]').forEach(g => g.addEventListener('scroll', () => {
    const c = g.parentElement.querySelector('.cnt');
    if(c) c.textContent = (Math.round(g.scrollLeft / g.clientWidth) + 1) + '/' + g.children.length;
  }, { passive:true }));
}

/* ---------- карточка объекта ---------- */
let openId = null;
function openSheet(id){
  const v = VILLAS.find(x => x.id === id); if(!v) return;
  openId = id;
  const near = PLACES.map(p => ({ p, d: dist(v, p) })).sort((a, b) => a.d - b.d).slice(0, 5);
  const hkt = PLACES.find(p => p.id === 'hkt');
  if(hkt && !near.some(n => n.p.id === 'hkt')) near.push({ p: hkt, d: dist(v, hkt) });
  const gm = `https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}`;
  $('#pn').innerHTML = `<button class="x" data-close aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button>
  ${gallery(v)}${''}<span class="badge ${v.fit}">${FIT[v.fit]}</span></div>
  <div class="shb">
    <div class="r1"><div><div class="area"><svg class="i"><use href="#i-pin"/></svg>${esc(v.area)} · ${esc(v.source)}</div><h2>${esc(v.name)}</h2></div>
      <button class="heart flat ${favs.includes(v.id) ? 'on' : ''}" data-fav="${v.id}" aria-label="В избранное"><svg class="i"><use href="#i-heart"/></svg></button></div>
    <div class="pbox"><div><small>За ночь</small><b>${money(v.night)}</b></div><div><small>За ${TRIP.nights} ночей</small><b>${money(v.total)}</b></div><div><small>С человека</small><b>${money(v.pp)}</b></div></div>
    <ul class="facts"><li>${v.bedrooms} спальни</li><li>${v.beds} кровати</li><li>${v.baths} ванные</li><li>до ${v.guests} гостей</li>${v.pool ? '<li>Бассейн</li>' : ''}<li>★ ${String(v.rating).replace('.', ',')} · ${v.reviews} отзывов</li></ul>
    ${v.desc ? `<p class="desc">${esc(v.desc)}</p>` : ''}
    ${v.note ? `<div class="note"><b>Заметка:</b> ${esc(v.note)}</div>` : ''}
    ${v.amenities && v.amenities.length ? `<h4>Удобства</h4><div class="am">${v.amenities.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}
    <div class="pc"><div><h4>Плюсы</h4><ul>${(v.pros || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul></div>
      <div><h4>Минусы</h4><ul>${(v.cons || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li>—</li>'}</ul></div></div>
    <h4>Что рядом (по прямой)</h4>
    <ul class="near">${near.map(n => `<li><span><i style="background:${CAT[n.p.type].color}"></i>${esc(n.p.name)}</span><b>${km(n.d)}</b></li>`).join('')}</ul>
    <div class="acts" style="padding:18px 0 0">
      ${v.link ? `<a class="btn p" data-ext href="${esc(v.link)}" target="_blank" rel="noopener">Открыть объявление<svg class="i"><use href="#i-ext"/></svg></a>` : ''}
      <button class="btn" data-onmap="${v.id}"><svg class="i"><use href="#i-map"/></svg>На карте</button>
      <a class="btn" data-ext href="${gm}" target="_blank" rel="noopener">Google Maps</a>
    </div>
  </div>`;
  bindGalleries($('#pn'));
  $('#sheet').classList.add('on');
  $('#pn').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  syncBack();
}
function closeSheet(){
  $('#sheet').classList.remove('on'); openId = null;
  document.body.style.overflow = ''; syncBack();
}

/* ---------- избранное ---------- */
function toggleFav(id){
  const i = favs.indexOf(id);
  if(i > -1) favs.splice(i, 1); else favs.push(id);
  store.set('phk-favs', favs); haptic();
  toast(i > -1 ? 'Убрано из выбора' : 'Добавлено в «Мой выбор»');
  refreshAll();
}
function moveFav(id, d){
  const i = favs.indexOf(id), j = i + d;
  if(i < 0 || j < 0 || j >= favs.length) return;
  [favs[i], favs[j]] = [favs[j], favs[i]];
  store.set('phk-favs', favs); renderFav(); renderList();
}
function renderFav(){
  $('#favN').textContent = favs.length || '';
  const items = favs.map(id => VILLAS.find(v => v.id === id));
  $('#favActs').style.display = items.length ? '' : 'none';
  if(!items.length){
    $('#flist').innerHTML = `<div class="empty">Пока пусто. Откройте «Варианты» и отметьте сердечком то, что нравится.</div>`;
    $('#cmp').innerHTML = ''; return;
  }
  $('#flist').innerHTML = items.map((v, i) => `<div class="fi"><span class="n">${i + 1}</span><img src="${esc(v.imgs[0])}" alt="">
    <div data-open="${v.id}" style="cursor:pointer"><h3>${esc(v.name)}</h3><small>${esc(v.area)} · ${money(v.total)}</small></div>
    <div class="mv"><button class="ib" data-mv="${v.id}" data-d="-1" aria-label="Выше"><svg class="i"><use href="#i-up"/></svg></button><button class="ib" data-mv="${v.id}" data-d="1" aria-label="Ниже"><svg class="i"><use href="#i-down"/></svg></button></div></div>`).join('');
  if(items.length < 2){ $('#cmp').innerHTML = ''; return; }
  const min = (k, inv) => { const a = items.map(v => v[k]); return inv ? Math.max(...a) : Math.min(...a); };
  const rows = [
    ['За период', v => money(v.total), 'total'], ['С человека', v => money(v.pp), 'pp'], ['За ночь', v => money(v.night), 'night'],
    ['Спальни', v => v.bedrooms, 'bedrooms', 1], ['Гостей', v => v.guests, 'guests', 1], ['До пляжа', v => km(v.beach), 'beach'],
    ['Рейтинг', v => String(v.rating).replace('.', ','), 'rating', 1], ['Бассейн', v => v.pool ? 'да' : 'нет']
  ];
  $('#cmp').innerHTML = `<div class="sec"><h4>Сравнение</h4></div><div class="scroll"><table><thead><tr><th></th>${items.map(v => `<th class="num">${esc(v.name)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(([t, f, k, inv]) => { const best = k ? min(k, inv) : null;
      return `<tr><th>${t}</th>${items.map(v => `<td class="num ${k && v[k] === best ? 'best' : ''}">${f(v)}</td>`).join('')}</tr>`; }).join('')}
  </tbody></table></div>`;
}
function favText(){
  const who = $('#who').value.trim();
  const lines = favs.map((id, i) => { const v = VILLAS.find(x => x.id === id);
    return `${i + 1}. ${v.name} (${v.area}) — ${money(v.total)} за ${TRIP.nights} ноч., ≈${money(v.pp)} с чел.${v.link ? '\n   ' + v.link : ''}`; });
  return `Мой выбор вилл на Пхукете${who ? ' — ' + who : ''}:\n` + lines.join('\n');
}
$('#who').value = store.get('phk-who', '');
$('#who').addEventListener('input', e => store.set('phk-who', e.target.value));
$('#shareBtn').addEventListener('click', () => {
  if(!favs.length) return;
  const page = /^https?:/.test(location.href) ? location.href.split('#')[0] : '';
  const first = VILLAS.find(v => v.id === favs[0]);
  openTgLink('https://t.me/share/url?url=' + encodeURIComponent(page || (first && first.link) || 'https://t.me') + '&text=' + encodeURIComponent(favText()));
});
$('#copyBtn').addEventListener('click', async () => {
  const t = favText();
  try{ await navigator.clipboard.writeText(t); toast('Текст скопирован'); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast('Текст скопирован'); }catch(_){ toast('Не удалось скопировать'); } a.remove(); }
});

/* ---------- карта ---------- */
let map = null, villaLayer = null, sel = null;
const catLayers = {};
const LAY = store.get('phk-layers', { villas:true, favOnly:false, beach:true, sight:true, night:true, shop:false, transport:true });
function initMap(){
  if(map) return true;
  if(!window.L){ $('#mapView').insertAdjacentHTML('beforeend', '<div class="mapmsg">Карта не загрузилась — проверьте интернет и откройте страницу заново.</div>'); return false; }
  map = L.map('map', { zoomControl:false, attributionControl:true }).setView([7.88, 98.32], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { subdomains:'abcd', maxZoom:19, attribution:'© OpenStreetMap, © CARTO' }).addTo(map);
  villaLayer = L.layerGroup();
  Object.keys(CAT).forEach(k => {
    catLayers[k] = L.layerGroup(PLACES.filter(p => p.type === k).map(p =>
      L.marker([p.lat, p.lng], { icon: L.divIcon({ className:'', iconSize:[0, 0],
        html:`<div class="ppin" style="background:${CAT[k].color}"><svg viewBox="0 0 24 24">${CAT[k].svg}</svg></div>` }) })
      .bindPopup(`<b>${esc(p.name)}</b>${esc(p.desc || '')}<br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener" data-ext>Google Maps</a>`)));
  });
  map.on('click', () => { sel = null; $('#peek').classList.remove('on'); drawVillas(); });
  drawVillas(); applyLayers();
  const pts = VILLAS.map(v => [v.lat, v.lng]);
  if(pts.length) map.fitBounds(pts, { padding:[60, 60], maxZoom:13 });
  return true;
}
function drawVillas(){
  if(!map) return;
  villaLayer.clearLayers();
  const list = LAY.favOnly ? VILLAS.filter(v => favs.includes(v.id)) : filtered();
  if(sel && !list.some(v => v.id === sel)) list.push(VILLAS.find(v => v.id === sel));
  list.forEach(v => {
    const cls = v.id === sel ? 'sel' : favs.includes(v.id) ? 'fav' : '';
    const label = (favs.includes(v.id) ? '♥ ' : '') + Math.round(v.night / 1000) + ' тыс';
    L.marker([v.lat, v.lng], { zIndexOffset: v.id === sel ? 1000 : 500, icon: L.divIcon({ className:'', iconSize:[0, 0], html:`<div class="vpin ${cls}">${label}</div>` }) })
      .on('click', e => { L.DomEvent.stopPropagation(e); selectVilla(v.id); }).addTo(villaLayer);
  });
}
function selectVilla(id, zoom){
  const v = VILLAS.find(x => x.id === id); sel = id; drawVillas();
  $('#peek').innerHTML = `<img src="${esc(v.imgs[0])}" alt=""><div><h3>${esc(v.name)}</h3>
    <div class="area">${esc(v.area)} · ${km(v.beach)} до пляжа</div><div style="margin-top:4px;font-size:14px"><b>${money(v.night)}</b> / ночь · ${v.bedrooms} спальни</div>
    <button class="chip" data-open="${v.id}" style="margin-top:8px;min-height:34px;padding:6px 12px">Подробнее</button></div>
    <button class="x" data-unpeek aria-label="Закрыть" style="width:30px;height:30px"><svg class="i" style="width:16px;height:16px"><use href="#i-x"/></svg></button>`;
  $('#peek').classList.add('on');
  zoom ? map.setView([v.lat, v.lng], 15) : map.panTo([v.lat, v.lng]);
}
function renderLayers(){
  const items = [['villas', 'Виллы', '#ff6a45'], ['favOnly', 'Только мой выбор', '#c2185b'], ...Object.entries(CAT).map(([k, c]) => [k, c.name, c.color])];
  $('#layers').innerHTML = items.map(([k, t, c]) => `<button class="chip ${LAY[k] ? 'on' : ''}" data-layer="${k}"><i style="background:${c}"></i>${t}</button>`).join('');
}
function applyLayers(){
  if(!map) return;
  (LAY.villas || LAY.favOnly) ? villaLayer.addTo(map) : villaLayer.remove();
  Object.keys(CAT).forEach(k => LAY[k] ? catLayers[k].addTo(map) : catLayers[k].remove());
  drawVillas();
}

/* ---------- вкладки и навигация ---------- */
let tab = 'list';
function setTab(t){
  tab = t;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === t + 'View'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if(t === 'map' && initMap()) setTimeout(() => map.invalidateSize(), 60);
  if(t === 'fav') renderFav();
  window.scrollTo(0, 0); syncBack();
}
function syncBack(){
  if(!inTG) return;
  try{ (openId || tab !== 'list') ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){}
}
if(inTG){ try{ tg.BackButton.onClick(() => openId ? closeSheet() : setTab('list')); }catch(e){} }

let tt;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }
function refreshAll(){
  renderList(); renderFav(); drawVillas();
  if(openId){ const h = $('#pn').querySelectorAll('[data-fav]'); h.forEach(b => b.classList.toggle('on', favs.includes(openId))); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-fav],[data-open],[data-close],[data-tab],[data-area],[data-flag],[data-reset],[data-mv],[data-layer],[data-onmap],[data-unpeek],[data-ext]');
  if(!el) return;
  const d = el.dataset;
  if('fav' in d){ e.stopPropagation(); toggleFav(d.fav); }
  else if('open' in d) openSheet(d.open);
  else if('close' in d) closeSheet();
  else if('tab' in d){ closeSheet(); setTab(d.tab); }
  else if('area' in d){ F.area = d.area; store.set('phk-filter', F); renderFilters(); renderList(); drawVillas(); }
  else if('flag' in d){ F[d.flag] = !F[d.flag]; store.set('phk-filter', F); renderFilters(); renderList(); drawVillas(); }
  else if('reset' in d){ Object.assign(F, { area:'all', budget:false, pool:false, rooms3:false }); store.set('phk-filter', F); renderFilters(); renderList(); drawVillas(); }
  else if('mv' in d) moveFav(d.mv, +d.d);
  else if('layer' in d){ LAY[d.layer] = !LAY[d.layer]; store.set('phk-layers', LAY); renderLayers(); applyLayers(); }
  else if('onmap' in d){ const id = d.onmap; closeSheet(); setTab('map'); if(map) setTimeout(() => selectVilla(id, true), 120); }
  else if('unpeek' in d){ sel = null; $('#peek').classList.remove('on'); drawVillas(); }
  else if('ext' in d){ if(openExt(el.href)) e.preventDefault(); }
});
$('#sort').addEventListener('change', e => { F.sort = e.target.value; store.set('phk-filter', F); renderList(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && openId) closeSheet(); });

renderFilters(); renderList(); renderFav(); renderLayers();
}
</script>
</body>
